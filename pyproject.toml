[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardedgateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway that cannot overspend and cannot leak PHI: pre-call dollar caps, a durable spend ledger, PHI redaction, and BAA-only routing."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "google-cloud-storage>=2.16",  # exercises guardedgateway/durable.py's fake-GCS tests
]
tiktoken = ["tiktoken>=0.7"]
stripe = ["stripe>=15"]
gcs = ["google-cloud-storage>=2.16"]

[project.scripts]
guardedgateway = "guardedgateway.cli:main"

[tool.setuptools.packages.find]
include = ["guardedgateway*"]

[tool.setuptools.package-data]
guardedgateway = ["templates/*.html", "pricing.yaml", "providers.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
